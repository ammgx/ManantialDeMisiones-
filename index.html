<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aguas Misiones · Panel</title>
<style>
:root{--p:#0F7B9B;--s:#3FBFBF;--ok:#1F8B4C;--bad:#C0392B;--warn:#B7791F;--bg:#F8FAFB;--card:#fff;--tx:#1B1B1B;--mu:#667;--bd:#DDE5E9;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--p:#4FC3F7;--s:#4DB6AC;--ok:#81C784;--bad:#EF8A80;--warn:#F0C56B;--bg:#10171A;--card:#182125;--tx:#E8EEF0;--mu:#93A3AA;--bd:#2A373C;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--p);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(prefers-color-scheme:dark){header{color:#0b1316}}
header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
header img{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain}
header h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid currentColor;color:inherit}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mu);font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
@media(prefers-color-scheme:dark){nav button.on{color:#0b1316}}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px}
h2{font-size:17px;margin:0 0 10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-size:12px;text-transform:uppercase}
td.r,th.r{text-align:right}
button,input,select,textarea{font:inherit}
button{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--p);border-color:var(--p);color:#fff}
@media(prefers-color-scheme:dark){button.pri{color:#0b1316}}
button.dng{color:var(--bad)}button.sm{padding:4px 9px;font-size:13px}
input,select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mu{color:var(--mu)}
.bar{height:10px;border-radius:5px;background:var(--s);min-width:2px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
.login-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.login-head img{width:38px;height:38px;border-radius:10px;background:#fff;object-fit:contain}
.hide{display:none!important}
.support{position:fixed;right:12px;bottom:12px;font-size:12px;padding:6px 10px;border-radius:999px;text-decoration:none;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.support.light{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
details.mg{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
details.mg>summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg)}
details.mg[open]>summary{border-bottom:1px solid var(--bd)}
details.mg .tw{padding:0 6px 6px}
details.mg table{min-width:660px}
@media(max-width:640px){
 main{padding:10px}
 header{padding:8px 10px;gap:8px}
 header img{width:28px;height:28px}
 header h1{font-size:15px}
 #ver{display:none}
 #me{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .card{padding:11px;border-radius:10px;margin-bottom:10px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .kpi b{font-size:19px}
 table{min-width:0}
 th,td{padding:7px 4px;font-size:13px}
 .hide-sm{display:none!important}
 nav{padding:6px 8px}
 nav button{padding:7px 11px;font-size:14px}
 button{padding:9px 12px}
 button.sm{padding:6px 9px}
 input,select,textarea{padding:9px 10px}
 dialog{padding:12px;border-radius:12px;max-height:92vh}
 details.mg>summary{padding:9px 10px}
 details.mg table{min-width:520px}
 .support{right:8px;bottom:8px;font-size:11px;padding:5px 9px}
}
</style>
</head>
<body>
<div id="login" class="hide"><div class="card">
<div class="login-head"><img src="logo.png" alt="Aguas Misiones"><div><h2 style="margin:0">Aguas Misiones</h2><div class="mu" style="font-size:13px">Panel de administración</div></div></div>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
<p id="lerr" class="bad hide"></p>
<div class="row" style="margin-top:12px"><button class="pri" id="go" style="flex:1">Ingresar</button></div>
</div></div>
<div id="app" class="hide">
<header><div class="brand"><img src="logo.png" alt="Aguas Misiones"><h1>Manantial de Misiones · Panel</h1></div><span id="ver" class="mu" style="font-size:12px">v1.6</span><span id="me" style="font-size:13px"></span><button id="out">Salir</button></header>
<nav id="nav"></nav><main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<a class="support support-light" href="https://wa.me/5493758501182" target="_blank" rel="noopener">Atención técnica</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://hjghvofqstmcnzccgasd.supabase.co';
const SB_KEY='sb_publishable_87onxbvon9tgWbGWwQbZAg_odZx2slc';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'$ '+((c||0)/100).toLocaleString('es-AR',{maximumFractionDigits:2});
const fdt=t=>t?new Date(Number(t)).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'—';
const PAY={EFECTIVO:'Efectivo',TRANSFERENCIA:'Transferencia',TARJETA:'Tarjeta',DEBITO:'Débito'};
const avail=c=>c.total_cash_cents+c.total_transfer_cents+c.total_debit_cents-(c.total_expenses_cents||0);
const declDiff=c=>(c.counted_cents||0)-avail(c);
let S={products:[],users:[],clients:[],cash_sessions:[],price_log:[]},ME=null,tab='home',A=null,CASHF={u:'',st:''},CLIF={q:'',f:'all'},SALF={month:'all',user:'',pay:'',q:'',voided:false};
let SALES={loaded:false,loading:false,error:null,sales:[],items:[],pays:[]};
const ok=r=>{if(r.error){alert('Error: '+r.error.message);throw r.error}return r.data};

const isoDay=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const monthLabel=k=>{const [y,m]=k.split('-');return (MONTHS[Number(m)-1]||'')+' '+y};
const monthBounds=k=>{const [y,m]=k.split('-').map(Number);return {from:new Date(y,m-1,1).getTime(),to:new Date(y,m,0,23,59,59,999).getTime()}};
function groupByMonth(list){
  const map=new Map();
  for(const c of list){
    const t=c.closed_at||c.opened_at||0;
    const k=monthKey(t);
    if(!map.has(k))map.set(k,[]);
    map.get(k).push(c);
  }
  return [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
}

async function paged(build,onPage){
  const out=[];
  for(let from=0;;from+=1000){
    const r=ok(await build().order('id').range(from,from+999));
    out.push(...r);
    onPage&&onPage(out.length);
    if(r.length<1000)break;
  }
  return out;
}

async function load(){
  const [p,u,c,pl,cs]=await Promise.all([
    paged(()=>sb.from('products').select('*')),
    paged(()=>sb.from('profiles').select('*')),
    paged(()=>sb.from('clients').select('*')),
    sb.from('price_log').select('*').order('changed_at',{ascending:false}).limit(30),
    paged(()=>sb.from('cash_sessions').select('*'))]);
  S.products=p.sort(byProdOrder);
  S.users=u.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es'));
  S.clients=c;
  S.cash_sessions=cs;
  S.price_log=ok(pl).map(l=>({at:l.changed_at,name:l.product_name,from:l.old_cents,to:l.new_cents}));
}

function showLogin(msg){$('#app').classList.add('hide');$('#login').classList.remove('hide');const e=$('#lerr');e.textContent=msg||'';e.classList.toggle('hide',!msg)}
async function enter(user){
  const {data:pr}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!pr||!pr.active||pr.role!=='ADMIN'){await sb.auth.signOut();return showLogin('Este panel es solo para administradores.')}
  ME=pr;$('#me').textContent=pr.name;
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#view').innerHTML='<p class="mu">Cargando…</p>';
  A=null;SALES={loaded:false,loading:false,error:null,sales:[],items:[],pays:[]};
  try{await load();render()}catch(e){}
}
$('#go').onclick=async()=>{
  $('#go').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  $('#go').disabled=false;
  if(error)return showLogin('Email o contraseña incorrectos.');
  $('#pw').value='';enter(data.user);
};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#out').onclick=async()=>{await sb.auth.signOut();ME=null;showLogin()};
(async()=>{const {data}=await sb.auth.getSession();data.session?enter(data.session.user):showLogin()})();

const TABS=[['home','Resumen'],['sales','Ventas'],['clients','Clientes'],['cash','Cierres de caja'],['prices','Precios'],['users','Usuarios'],['acct','Cuenta'],['archive','Archivo']];
const bind={};
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  $('#view').innerHTML=({home:vHome,sales:vSales,clients:vClients,cash:vCash,archive:vArchive,prices:vPrices,users:vUsers,acct:vAcct})[tab]();
  bind[tab]&&bind[tab]();
}
const closed=()=>S.cash_sessions.filter(c=>c.is_closed).sort((a,b)=>b.closed_at-a.closed_at);
const byProdOrder=(a,b)=>(Number(a.sort_order??0)-Number(b.sort_order??0))||String(a.name||'').localeCompare(String(b.name||''),'es');
const nameOf=id=>(S.users.find(u=>u.id===id)||{}).name||'—';

function vHome(){
  const cl=closed(),last=cl[0],pend=cl.filter(c=>c.review_status=='PENDIENTE').length;
  const open=S.cash_sessions.filter(c=>!c.is_closed).length;
  const m30=cl.reduce((a,c)=>a+c.total_cents,0);
  const debt=S.clients.reduce((a,c)=>a+(c.pending_amount||0),0);
  const mx=Math.max(1,...cl.slice(0,7).map(c=>c.total_cents));
  return `<div class="grid">
   <div class="card kpi"><small>Último cierre</small><b>${last?money(last.total_cents):'—'}</b><small>${last?fdt(last.closed_at):''}</small></div>
   <div class="card kpi"><small>Ventas registradas</small><b>${money(m30)}</b></div>
   <div class="card kpi"><small>Cierres sin controlar</small><b class="${pend?'warn':'ok'}">${pend}</b><small>${open} cajas abiertas</small></div>
   <div class="card kpi"><small>Deuda de clientes</small><b>${money(debt)}</b></div></div>
  <div class="card"><h2>Últimos cierres</h2>${cl.slice(0,7).map(c=>`<div class="row" style="flex-wrap:nowrap"><span style="width:90px" class="mu">${fdt(c.closed_at).split(',')[0]}</span><div class="bar" style="width:${c.total_cents/mx*100}%"></div><b>${money(c.total_cents)}</b></div>`).join('')||'<p class="mu">Todavía no hay cierres.</p>'}</div>`;
}

function stTag(c){const s=c.review_status;return `<span class="tag ${s=='CONFORME'?'ok':s=='OBSERVADO'?'bad':'warn'}">${s=='CONFORME'?'Conforme':s=='OBSERVADO'?'Observado':'Pendiente'}</span>`}

function filteredClients(){
  const q=CLIF.q.trim().toLowerCase();
  return S.clients.filter(c=>{
    if(CLIF.f==='debt'&&!(c.pending_amount>0))return false;
    if(CLIF.f==='active'&&!c.active)return false;
    if(CLIF.f==='inactive'&&c.active)return false;
    if(!q)return true;
    return [c.name,c.phone,c.address,c.localidad,c.reference,c.description]
      .some(v=>String(v||'').toLowerCase().includes(q));
  }).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es'));
}
function vClients(){
  const debt=S.clients.reduce((a,c)=>a+Math.max(0,c.pending_amount||0),0);
  const withDebt=S.clients.filter(c=>c.pending_amount>0).length;
  const inactive=S.clients.filter(c=>!c.active).length;
  return `<div class="grid">
   <div class="card kpi"><small>Clientes</small><b>${S.clients.length}</b></div>
   <div class="card kpi"><small>Con deuda</small><b class="${withDebt?'warn':'ok'}">${withDebt}</b></div>
   <div class="card kpi"><small>Deuda total</small><b>${money(debt)}</b></div>
   <div class="card kpi"><small>Inactivos</small><b class="mu">${inactive}</b></div></div>
  <div class="card"><div class="row"><h2 style="flex:1;margin:0">Clientes</h2>
   <button id="ccsv">Exportar CSV</button></div>
   <div class="row">
    <input id="cq" placeholder="Buscar nombre, teléfono, dirección o zona" value="${esc(CLIF.q)}" style="flex:1;min-width:200px">
    <select id="cf" style="width:auto">
     <option value="all" ${CLIF.f==='all'?'selected':''}>Todos</option>
     <option value="debt" ${CLIF.f==='debt'?'selected':''}>Con deuda</option>
     <option value="active" ${CLIF.f==='active'?'selected':''}>Activos</option>
     <option value="inactive" ${CLIF.f==='inactive'?'selected':''}>Inactivos</option>
    </select>
   </div>
   <div id="clist"></div>
   <p class="mu" style="font-size:12px;margin:6px 0 0">Los datos de contacto y la deuda se editan desde la app; acá se consultan.</p>
  </div>`;
}
function fillClients(){
  const all=filteredClients(),list=all.slice(0,200);
  $('#clist').innerHTML=`<p class="mu" style="margin:0 0 6px;font-size:13px">${all.length} ${all.length==1?'cliente':'clientes'}${all.length>list.length?` · mostrando los primeros ${list.length}`:''}</p>
   <div class="tw"><table><thead><tr><th>Cliente</th><th class="hide-sm">Teléfono</th><th class="r">Deuda</th><th>Estado</th><th></th></tr></thead><tbody>
   ${list.map(c=>`<tr>
    <td><b>${esc(c.name)}</b>${c.localidad?`<br><span class="mu">${esc(c.localidad)}</span>`:''}</td>
    <td class="hide-sm">${esc(c.phone)||'—'}</td>
    <td class="r ${c.pending_amount>0?'warn':''}"><b>${money(c.pending_amount)}</b></td>
    <td>${c.active?'<span class="tag ok">Activo</span>':'<span class="tag mu">Baja</span>'}</td>
    <td><button class="sm" data-cid="${c.id}">Ver</button></td></tr>`).join('')||'<tr><td colspan="5" class="mu">Sin resultados.</td></tr>'}
   </tbody></table></div>`;
  $('#clist').querySelectorAll('button[data-cid]').forEach(b=>b.onclick=()=>openClient(b.dataset.cid));
}
bind.clients=()=>{
  fillClients();
  $('#cq').oninput=e=>{CLIF.q=e.target.value;fillClients()};
  $('#cf').onchange=e=>{CLIF.f=e.target.value;fillClients()};
  $('#ccsv').onclick=clientsCsv;
};
function clientsCsv(){
  const list=filteredClients();
  if(!list.length)return alert('No hay clientes para los filtros elegidos.');
  const h=['nombre','telefono','direccion','localidad','referencia','descripcion','deuda','activo','dispensador','ajuste_precio'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=list.map(c=>[c.name,c.phone,c.address,c.localidad,c.reference,c.description,(c.pending_amount||0)/100,c.active?'SI':'NO',c.has_dispenser?'SI':'NO',(c.price_diff_cents||0)/100].map(q).join(','));
  dl('clientes-'+isoDay(Date.now())+'.csv','\ufeff'+[h.join(','),...rows].join('\n'),'text/csv');
}
function waHref(phone){
  const d=String(phone||'').replace(/\D/g,'');
  if(!d)return null;
  return 'https://wa.me/'+(d.startsWith('54')?d:'549'+d.replace(/^0+/,''));
}
async function openClient(id){
  const c=S.clients.find(x=>x.id===id);if(!c)return;
  const d=$('#dlg');
  d.innerHTML='<p class="mu">Cargando historial…</p>';if(!d.open)d.showModal();
  try{
    const [sales,pays]=await Promise.all([
      paged(()=>sb.from('sales').select('*').eq('client_id',id)),
      paged(()=>sb.from('payments').select('*').eq('client_id',id))]);
    sales.sort((a,b)=>b.created_at-a.created_at);
    pays.sort((a,b)=>b.created_at-a.created_at);
    const valid=sales.filter(s=>!s.is_voided);
    const vendido=valid.reduce((a,s)=>a+s.total_cents,0);
    const fiado=valid.reduce((a,s)=>a+(s.is_on_account?Math.max(0,s.total_cents-(s.paid_cents||0)):0),0);
    const cobrado=pays.reduce((a,p)=>a+p.amount_cents,0);
    const deuda=c.pending_amount||0;
    const wa=waHref(c.phone);
    const saleRows=sales.slice(0,100).map(s=>{
      const state=s.is_voided?'<span class="tag bad">Anulada</span>':(s.is_on_account&&s.total_cents-(s.paid_cents||0)>0?'<span class="tag warn">Fiado</span>':'<span class="tag ok">Pagada</span>');
      return `<tr><td>${fdt(s.created_at)}</td><td class="hide-sm">${PAY[s.payment_type]||s.payment_type}</td><td class="r">${money(s.total_cents)}</td><td class="r hide-sm">${money(s.paid_cents)}</td><td>${state}</td></tr>`;
    }).join('');
    const payRows=pays.slice(0,100).map(p=>`<tr><td>${fdt(p.created_at)}</td><td>${PAY[p.method]||p.method}</td><td class="r">${money(p.amount_cents)}</td></tr>`).join('');
    d.innerHTML=`<h2>${esc(c.name)}</h2>
    <p class="mu" style="margin:0 0 8px">${[c.localidad,c.address].filter(Boolean).map(esc).join(' · ')||'Sin dirección'}</p>
    <div class="row" style="margin:0 0 10px">
      ${c.active?'<span class="tag ok">Activo</span>':'<span class="tag mu">Inactivo</span>'}
      ${c.has_dispenser?'<span class="tag ok">Con dispensador</span>':''}
      ${deuda>0?`<span class="tag warn">Debe ${money(deuda)}</span>`:'<span class="tag ok">Sin deuda</span>'}
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin:0"><span>Teléfono</span><b>${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:'—'}</b></div>
      <div class="row" style="justify-content:space-between;margin:0"><span>Dirección</span><b>${esc(c.address)||'—'}</b></div>
      <div class="row" style="justify-content:space-between;margin:0"><span>Referencia</span><b>${esc(c.reference)||'—'}</b></div>
      ${c.description?`<p class="mu" style="margin:6px 0 0">${esc(c.description)}</p>`:''}
    </div>
    <div class="grid">
      <div class="card kpi"><small>Vendido</small><b>${money(vendido)}</b></div>
      <div class="card kpi"><small>Fiado generado</small><b>${money(fiado)}</b></div>
      <div class="card kpi"><small>Cobrado</small><b>${money(cobrado)}</b></div>
    </div>
    <details open style="margin-top:6px"><summary>Ventas (${sales.length})</summary>
      <div class="tw"><table><thead><tr><th>Fecha</th><th class="hide-sm">Medio</th><th class="r">Total</th><th class="r hide-sm">Pagado</th><th>Estado</th></tr></thead><tbody>${saleRows||'<tr><td colspan="5" class="mu">Sin ventas.</td></tr>'}</tbody></table></div>

async function loadSales(){
  if(SALES.loading)return;
  SALES.loading=true;SALES.error=null;
  const msg=t=>{const el=$('#smsg');if(el)el.textContent=t};
  try{
    msg('Cargando ventas…');
    const sales=await paged(()=>sb.from('sales').select('*'),n=>msg('Cargando ventas… '+n));
    msg('Cargando ítems de venta…');
    const items=await paged(()=>sb.from('sale_items').select('*'),n=>msg('Cargando ítems… '+n));
    msg('Cargando cobros…');
    const pays=await paged(()=>sb.from('payments').select('*'),n=>msg('Cargando cobros… '+n));
    const cli=new Map(S.clients.map(c=>[c.id,c.name]));
    const usr=new Map(S.users.map(u=>[u.id,u.name]));
    const prod=new Map(S.products.map(p=>[p.id,p.name]));
    const itemsBy=new Map();
    for(const it of items){if(!itemsBy.has(it.sale_id))itemsBy.set(it.sale_id,[]);itemsBy.get(it.sale_id).push(it)}
    const idx=new Map(sales.map(s=>{
      const its=itemsBy.get(s.id)||[];
      const text=[cli.get(s.client_id),s.notes,s.void_reason,...its.map(i=>prod.get(i.product_id))]
        .filter(Boolean).join(' ').toLowerCase();
      return [s.id,text];
    }));
    SALES={loaded:true,loading:false,error:null,sales,items,pays,itemsBy,idx,cli,usr,prod,loaded_at:Date.now()};
  }catch(e){
    SALES.loading=false;
    SALES.error=(e&&e.message)?e.message:'No se pudieron cargar las ventas';
  }
}
function groupByCreated(list){
  const map=new Map();
  for(const s of list){const k=monthKey(s.created_at);if(!map.has(k))map.set(k,[]);map.get(k).push(s)}
  return [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
}

function salesFiltered(){
  const q=SALF.q.trim().toLowerCase();
  return SALES.sales.filter(s=>{
    if(SALF.month!=='all'&&monthKey(s.created_at)!==SALF.month)return false;
    if(SALF.user&&s.created_by!==SALF.user)return false;
    if(SALF.pay&&s.payment_type!==SALF.pay)return false;
    if(!SALF.voided&&s.is_voided)return false;
    if(q&&!(SALES.idx.get(s.id)||'').includes(q))return false;
    return true;
  }).sort((a,b)=>b.created_at-a.created_at);
}
function paymentsFiltered(){
  const q=SALF.q.trim().toLowerCase();
  const clients=q?new Set(salesFiltered().map(s=>s.client_id)):null;
  return SALES.pays.filter(p=>{
    if(SALF.month!=='all'&&monthKey(p.created_at)!==SALF.month)return false;
    if(SALF.user&&p.created_by!==SALF.user)return false;
    if(SALF.pay&&p.method!==SALF.pay)return false;
    if(q&&!clients.has(p.client_id)&&!(SALES.cli.get(p.client_id)||'').toLowerCase().includes(q))return false;
    return true;
  });
}

function renderRanking(list){
  const ids=new Set(list.filter(s=>!s.is_voided).map(s=>s.id));
  const agg=new Map();
  for(const it of SALES.items){
    if(!ids.has(it.sale_id))continue;
    const cur=agg.get(it.product_id)||{qty:0,revenue:0};
    cur.qty+=it.quantity||0;cur.revenue+=it.subtotal_cents||0;
    agg.set(it.product_id,cur);
  }
  const top=[...agg.entries()]
    .map(([id,v])=>({name:SALES.prod.get(id)||'Producto eliminado',...v}))
    .sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  $('#stop').innerHTML=top.length
    ? `<div class="tw"><table><thead><tr><th>Producto</th><th class="r">Unidades</th><th class="r">Total</th></tr></thead><tbody>${top.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="r">${p.qty}</td><td class="r">${money(p.revenue)}</td></tr>`).join('')}</tbody></table></div>`

}

async function fetchIn(table,col,ids){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const part=ids.slice(i,i+50);
    let from=0;
    for(;;){
      const r=ok(await sb.from(table).select('*').in(col,part).order('id').range(from,from+999));
      out.push(...r);
      if(r.length<1000)break;
      from+=1000;
    }
  }
  return out;
}

async function exportArchive(){
  const k=$('#arm').value;
  const ses=k==='all'?closed():closed().filter(c=>monthKey(c.closed_at)===k);
  if(!ses.length)return alert('No hay cajas en ese mes.');
  if(k==='all'&&!confirm('Vas a exportar TODO el historial cargado. Puede tardar. ¿Seguir?'))return;
  const btn=$('#exar');btn.disabled=true;btn.textContent='Generando…';
  try{
    const ids=ses.map(c=>c.id);
    const sales=await fetchIn('sales','cash_session_id',ids);
    const pays=await fetchIn('payments','cash_session_id',ids);
    const movs=await fetchIn('cash_movements','cash_session_id',ids);
    const items=await fetchIn('sale_items','sale_id',sales.map(s=>s.id));
    const b=k==='all'?{from:null,to:null}:monthBounds(k);
    const data={version:1,generated_at:Date.now(),from:b.from,to:b.to,
      cash_sessions:ses,sales,sale_items:items,payments:pays,cash_movements:movs,
      clients:S.clients,products:S.products,profiles:S.users};
    dl('archivo-cajas-'+(k==='all'?'completo':k)+'.json',JSON.stringify(data),'application/json');
  }catch(e){/* ok() ya avisó del error */}
  finally{btn.disabled=false;btn.textContent='Descargar archivo'}
}

function readArchive(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.cash_sessions))throw new Error('no parece un archivo de cajas del panel');
      A=d;render();
    }catch(e){alert('No se pudo abrir el archivo: '+e.message)}
  };
  r.readAsText(file);
}

async function moveProd(id,dir){
  const arr=[...S.products],i=arr.findIndex(p=>p.id===id),j=i+dir;
  if(i<0||j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  const changed=[];
  arr.forEach((p,k)=>{if(Number(p.sort_order??0)!==k){p.sort_order=k;changed.push({id:p.id,sort_order:k})}});
  S.products=arr;
  render();
  const res=await Promise.all(changed.map(c=>sb.from('products').update({sort_order:c.sort_order}).eq('id',c.id)));
  const bad=res.find(r=>r.error);
  if(bad){alert('No se pudo guardar el orden: '+bad.error.message);await load();render()}
}

    btn.disabled=true;btn.textContent='Generando…';
    try{
      step('Cajas…');const sessions=await paged(()=>sb.from('cash_sessions').select('*'));
      step('Ventas…');const sales=await paged(()=>sb.from('sales').select('*'));
      step('Ítems…');const items=await paged(()=>sb.from('sale_items').select('*'));
      step('Cobros…');const pays=await paged(()=>sb.from('payments').select('*'));
      step('Movimientos…');const movs=await paged(()=>sb.from('cash_movements').select('*'));
      const data={version:1,type:'respaldo-completo',generated_at:Date.now(),
        cash_sessions:sessions,sales,sale_items:items,payments:pays,cash_movements:movs,
        clients:S.clients,products:S.products,profiles:S.users,price_log:S.price_log};
      dl('respaldo-completo-'+isoDay(Date.now())+'.json',JSON.stringify(data,null,2),'application/json');
      step('Listo · archivo descargado.');
    }catch(e){step('No se pudo generar el respaldo.')}
    finally{btn.disabled=false;btn.textContent='Descargar respaldo'}
  };
};
</script>
</body>
</html>
